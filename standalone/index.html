<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏀</text></svg>" />
    <title>Coach Sim</title>
    <script>
      // Force a valid hash route before the router initializes, so the app
      // can never land on an unmatched/blank state regardless of how the
      // page URL was arrived at (bookmark, redirect, missing fragment, etc.)
      if (!location.hash || !location.hash.startsWith("#/")) {
        location.replace(location.pathname + location.search + "#/");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
